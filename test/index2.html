<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>GCT Interface</title>
  <style>
    body {
      background-color: #121212;
      font-family: 'Courier New', monospace;
      margin: 50px;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
    }
    h1, h2 {
      text-align: center;
      margin-bottom: 1rem;
      color: #00ff90;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .FDC-label { color: #00ff90; }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover  { transform: scale(1.02); }
    button:active { transform: scale(0.98); }
    @media (orientation: portrait) {
      button { font-size: 1.3rem; height: 70px; }
    }
    .commande {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      width: 360px;
    }
    .btn-marche {
      flex: 1;
      padding: 0.5rem 1.1rem;
      font-size: 1rem;
      font-family: 'Courier New', monospace;
      background-color: #00ff90;
      color: #000000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      height: 50px;
      font-weight: bold;
      max-width: 260px;
      text-align: center;
    }
    .btn-arret {
      width: 60px;
      height: 30px;
      margin-left: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ff0000;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.3rem;
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }
    .vannes-container {
      display: flex;
      justify-content: center;
      gap: 80px;
      margin-top: 20px;
    }
    .vanne {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Courier New', monospace;
    }
    .vanne-label {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 2px;
      line-height: 1.1;
      color: #00ff90;
    }
    .vanne-img {
      display: block;
      width: 250px;
      margin-bottom: 2px;
    }
    .fdc { font-size: 1.1rem; }
    .fdc-etat {
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 1rem;
    }
    .fdc-etat-off { background-color: #ff0000; color: white; }
    .fdc-etat-on  { background-color: #0077ff; color: black; }
    .chrono {
      color: #00ff90;
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <h1>Contrôle électrovannes GCT</h1>

  <div class="commande">
    <button class="btn-marche" onclick="sendCommand('ACTION_1')">CYCLE COMPLET</button>
    <button class="btn-arret"  onclick="sendCommand('ACTION_2')">OFF</button>
  </div>
  <div class="commande">
    <button class="btn-marche" onclick="sendCommand('ACTION_3')">ELECTROVANNES SELECTIVES</button>
    <button class="btn-arret"  onclick="sendCommand('ACTION_4')">OFF</button>
  </div>
  <div class="commande">
    <button class="btn-marche" onclick="sendCommand('ACTION_5')">ELECTROVANNES PERMISSIVES A</button>
    <button class="btn-arret"  onclick="sendCommand('ACTION_6')">OFF</button>
  </div>
  <div class="commande">
    <button class="btn-marche" onclick="sendCommand('ACTION_7')">ELECTROVANNES PERMISSIVES B</button>
    <button class="btn-arret"  onclick="sendCommand('ACTION_8')">OFF</button>
  </div>

  <h2>État des FDC Ouverture</h2>

  <div class="vannes-container">
    <!-- VANNE 1 -->
    <div class="vanne">
      <span class="vanne-label">Vanne 1</span>
      <img src="/Symbole_vanne.png" class="vanne-img">
      <div class="fdc">
        <span class="FDC-label">FDC ouverture :</span>
        <span id="FDC1" class="fdc-etat-off">INACTIF</span>
      </div>
      <div class="chrono">
        <span>Temps :</span>
        <span id="chronoV1">00:00.000</span>
      </div>
    </div>

    <!-- VANNE 2 -->
    <div class="vanne">
      <span class="vanne-label">Vanne 2</span>
      <img src="/Symbole_vanne.png" class="vanne-img">
      <div class="fdc">
        <span class="FDC-label">FDC ouverture :</span>
        <span id="FDC2" class="fdc-etat-off">INACTIF</span>
      </div>
      <div class="chrono">
        <span>Temps :</span>
        <span id="chronoV2">00:00.000</span>
      </div>
    </div>
  </div>

  <script>
    // ---- Formatage du temps ----
    function formatTime(ms) {
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const msRest = ms % 1000;
      return (
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0") + "." +
        String(msRest).padStart(3, "0")
      );
    }

    function updateChrono(id, value) {
      document.getElementById(id).textContent = formatTime(Number(value));
    }

    // ---- Mise à jour FDC ----
    function updateFDCouverture(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      if (value == 1) {
        el.textContent = "ACTIF";
        el.className = "fdc-etat-on";
      } else {
        el.textContent = "INACTIF";
        el.className = "fdc-etat-off";
      }
    }

    // ---- WebSockets ----
    let socketA, socketB;
    try {
      socketA = new WebSocket("ws://192.168.1.2:81/");
      socketB = new WebSocket("ws://192.168.1.3:81/");
    } catch (e) {
      console.warn("Connexion WebSocket impossible.");
    }

    // Messages reçus de l'ESP32 A
    if (socketA) {
      socketA.onmessage = (event) => {
        const [type, value] = event.data.split(":");
        if (type === "FDC1")    updateFDCouverture("FDC1", value);
        if (type === "FDC2")    updateFDCouverture("FDC2", value);
        if (type === "Chrono_1") updateChrono("chronoV1", value);
        if (type === "Chrono_2") updateChrono("chronoV2", value);
      };
    }

    // Surveillance connexion
    function surveillerSocket(socket, nom) {
      if (!socket) { console.error(`Socket ${nom} non initialisé.`); return; }
      socket.onopen  = () => console.log(`${nom} CONNECTÉ.`);
      socket.onclose = () => console.warn(`${nom} DÉCONNECTÉ.`);
      socket.onerror = (e)  => console.error(`Erreur ${nom} :`, e);
    }

    surveillerSocket(socketA, "ESP32_A");
    surveillerSocket(socketB, "ESP32_B");

    // ---- Envoi commandes ----
    function sendCommand(cmd) {
      const actionsA  = ["ACTION_3", "ACTION_4", "ACTION_5", "ACTION_6"];
      const actionsB  = ["ACTION_7", "ACTION_8"];
      const actionsAB = ["ACTION_1", "ACTION_2"];

      if (actionsAB.includes(cmd)) {
        if (socketA?.readyState !== WebSocket.OPEN || socketB?.readyState !== WebSocket.OPEN) {
          alert("Erreur : Au moins un des deux ESP32 n'est pas connecté.");
        }
        if (socketA?.readyState === WebSocket.OPEN) socketA.send(cmd);
        if (socketB?.readyState === WebSocket.OPEN) socketB.send(cmd);
        return;
      }
      if (actionsA.includes(cmd)) {
        if (socketA?.readyState === WebSocket.OPEN) socketA.send(cmd);
        else alert("Erreur : l'ESP32 A n'est pas connecté pour cette action.");
        return;
      }
      if (actionsB.includes(cmd)) {
        if (socketB?.readyState === WebSocket.OPEN) socketB.send(cmd);
        else alert("Erreur : l'ESP32 B n'est pas connecté pour cette action.");
        return;
      }
    }
  </script>

</body>
</html>
