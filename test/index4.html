<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>GCT Interface</title>
  <style>
    /* Style de base conservé du terminal */
    body {
      background-color: #121212;
      font-family: 'Courier New', monospace;
      margin: 50px;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;     /* Centre horizontalement */
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      margin-bottom: 1rem;
      color: #00ff90;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    h2 {
      text-align: center;
      margin-bottom: 1rem;
      color: #00ff90;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .FDC-label {
      color: #00ff90;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      transform: scale(1.02);
    }

    button:active {
      transform: scale(0.98);
    }

    /* Adaptation mobile */
    @media (orientation: portrait) {
      button {
        font-size: 1.3rem;
        height: 70px;
      }
    }

    .commande {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      width: 360px;
    }

    .btn-marche {
      flex: 1;
      padding: 0.5rem 1.1rem;
      font-size: 1rem;
      font-family: 'Courier New', monospace;
      background-color: #00ff90;
      color: #000000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      height: 50px;
      font-weight: bold;
      max-width: 260px;
      text-align: center;
    }

    .btn-arret {
      width: 60px;
      height: 30px;
      margin-left: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ff0000;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.3rem;
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }
  
    /* Conteneur global des deux vannes */
    .vannes-container {
      display: flex;
      justify-content: center;
      gap: 80px;               /* espace entre vanne 1 et vanne 2 */
      margin-top: 20px;
    }

    /* Bloc d'une vanne */
    .vanne {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Courier New', monospace;
    }

    /* Titre vanne */
    .vanne-label {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 2px;
      line-height: 1.1;
      color: #00ff90;
    }

    /* Image vanne */
    .vanne-img {
      display: block;
      width: 250px;
      margin-bottom: 2px;
    }

    /* Ligne FDC */
    .fdc {
      font-size: 1.1rem;
    }

    /* État FDC */
    .fdc-etat {
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 1rem;
    }

    /* Inactif */
    .fdc-etat-off {
      background-color: #ff0000;
      color: white;
    }

    /* Actif */
    .fdc-etat-on {
      background-color: #0077ff;
      color: black;
    }
    /* Chronomêtre*/
    .chrono{
      color: #00ff90;
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      margin-top: 5px;
    }
  </style>
</head>

  <script>
    const chronoV1 = { start: 0, elapsed: 0, running: false, timer: null };
    const chronoV2 = { start: 0, elapsed: 0, running: false, timer: null };

    function formatTime(ms) {
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const msRest = ms % 1000;
      return (
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0") + "." +
        String(msRest).padStart(3, "0")
      );
    }

    function startChrono(chrono, id) {
      if (chrono.running) return;
      chrono.running = true;
      chrono.start = Date.now() - chrono.elapsed;
      chrono.timer = setInterval(() => {
      chrono.elapsed = Date.now() - chrono.start;
      document.getElementById(id).textContent =
        formatTime(chrono.elapsed);
        }, 50);
    }

    function stopChrono(chrono) {
      if (!chrono.running) return;
      chrono.running = false;
      clearInterval(chrono.timer);
    }

    function resetChrono(chrono, id) {
      stopChrono(chrono);
      chrono.elapsed = 0;
      document.getElementById(id).textContent = "00:00.000";
    }
  </script>

  <script>
    function cycleComplet() {
      resetChrono(chronoV1, "chronoV1");
      resetChrono(chronoV2, "chronoV2");
      startChrono(chronoV1, "chronoV1");
      startChrono(chronoV2, "chronoV2");
    }

    function offSystem() {
      stopChrono(chronoV1);
      stopChrono(chronoV2);
    }
  </script>

  <script>
    function updateFDCouverture(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      if (value == 1) {
        el.textContent = "ACTIF";
        el.className = "fdc-etat-on";
        if (id === "FDC1") stopChrono(chronoV1);
        if (id === "FDC2") stopChrono(chronoV2);
      } else {
        el.textContent = "INACTIF";
        el.className = "fdc-etat-off";
      }
    }
  </script>
